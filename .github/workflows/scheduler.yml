name: Tender Watch WhatsApp

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run-tender-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TARGET_WEBSITE: ${{ vars.TARGET_WEBSITE }}
      TENDER_URLS: ${{ vars.TENDER_URLS }}
      TARGET_KEYWORDS: ${{ vars.TARGET_KEYWORDS }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      CSV_PATH: ${{ vars.CSV_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tender crawler
        run: python riaz_tender_scraper.py

      - name: Save state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tender_state.json tender_results.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update tender state and CSV"
          git push
          
